import java.io.FileInputStream
import java.util.Properties

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace = "com.example.flutter_reccuring_reminder"
    compileSdk = 35
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId = "cz.fitvis.reminder"
        minSdkVersion = flutter.minSdkVersion
        targetSdkVersion = 35
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled = true
    }

    signingConfigs {
        debug {
            // Default
        }
        release {
            // Default
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = '../..'
}

configurations.all {
    resolutionStrategy {
        // home_widget 0.9.x pulls alpha Glance that requires AGP 9.1+ / compileSdk 37.
        // Force the latest stable Glance instead so the build works with AGP 8.x.
        force 'androidx.glance:glance:1.1.0'
        force 'androidx.glance:glance-appwidget:1.1.0'
        force 'androidx.glance:glance-material:1.1.0'
        force 'androidx.glance:glance-material3:1.1.0'
    }
    // Exclude the alpha Compose remote dependency pulled in transitively.
    exclude group: 'androidx.compose.remote', module: 'remote-creation-android'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation 'androidx.multidex:multidex:2.0.1'
}
