name: fit_vis_reminder
description: "Life Maintenance System — never forget your important obligations."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Local database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # Notifications
  awesome_notifications: ^0.11.0

  # Navigation
  go_router: ^14.8.1

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.0
  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  collection: ^1.19.1
  equatable: ^2.0.7
  home_widget: ^0.9.1
  share_plus: ^13.1.0
  device_calendar: ^4.3.3
  permission_handler: ^12.0.1
  app_links: ^7.0.0

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.4.13
  isar_generator: ^3.1.0+1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/image/
    - assets/icons/

  # fonts (add Inter TTF files to assets/fonts/ and uncomment):
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
